<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="오늘부터 갓생 · 루틴 트래커">
  <meta name="theme-color" content="#0D0F0E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="갓생">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>오늘부터 갓생</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 첫 로딩 동안 다크 배경 + 스피너 — iOS Safari 흰 화면 깜빡임 방지 */
    body { margin: 0; background-color: #0D0F0E; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background-color: #0D0F0E;
      transition: opacity .3s ease;
    }
    #loading .spinner {
      width: 38px; height: 38px;
      border: 3px solid #2C3134;
      border-top-color: #D8662F;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div></div>
  <script>
    // PWA 설치 상태/설치 트리거를 Flutter(dart:js_interop)에서 호출할 수 있게 노출.
    window.pwaInstall = (function () {
      var deferred = null; // beforeinstallprompt 이벤트 보관
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); // 브라우저 기본 미니 배너 억제 → 우리가 직접 띄움
        deferred = e;
      });
      window.addEventListener('appinstalled', function () {
        deferred = null;
      });
      function standalone() {
        return window.matchMedia('(display-mode: standalone)').matches
          || window.matchMedia('(display-mode: fullscreen)').matches
          || window.matchMedia('(display-mode: minimal-ui)').matches
          || window.navigator.standalone === true; // iOS Safari
      }
      function ios() {
        var ua = window.navigator.userAgent || '';
        return /iPad|iPhone|iPod/.test(ua)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
      }
      return {
        isStandalone: function () { return standalone(); },
        canInstall: function () { return deferred !== null; },
        isIos: function () { return ios(); },
        // 'accepted' | 'dismissed' | 'unavailable'
        promptInstall: function () {
          if (!deferred) return Promise.resolve('unavailable');
          var d = deferred;
          deferred = null; // 이벤트는 1회용
          d.prompt();
          return d.userChoice.then(function (c) { return c.outcome; });
        }
      };
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 첫 프레임 렌더 시 로딩 오버레이 제거
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
</body>
</html>
